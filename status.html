<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系統現在在幹嘛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #000; --bg-card: #0D0D0D; --bg-hover: #141414;
    --text-primary: #F2F0EA; --text-secondary: #9C9A93; --text-muted: #63615A;
    --gold: #CBBFA8; --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.18);
    --ok: #6FAE7C; --warn: #D8A657; --bad: #D06A62;
    --font-text: 'IBM Plex Sans', 'Noto Sans TC', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Noto Sans TC', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-page); color: var(--text-primary);
    font-family: var(--font-text); line-height: 1.6;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 2rem; }
  .topbar { border-bottom: 1px solid var(--border); padding: 1rem 0; }
  .back-link {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
    color: var(--text-secondary); text-decoration: none;
  }
  .back-link:hover { color: var(--gold); }
  header.hero { padding: 2rem 0 1.5rem; border-bottom: 1px solid var(--border); position: relative; }
  header.hero::after {
    content: ''; position: absolute; bottom: -1px; left: 0;
    width: 48px; height: 2px; background: var(--gold);
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 0.5rem;
  }
  h1 { font-size: 30px; font-weight: 700; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13.5px; margin: 0; max-width: 700px; }
  section { padding: 1.6rem 0; border-bottom: 1px solid var(--border); }
  section h2 {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 0.8rem; font-weight: 600;
  }
  .grid { display: grid; gap: 8px; }
  .row {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.75rem 0.95rem;
  }
  .row.bad { border-color: rgba(208,106,98,0.45); }
  .row.warn { border-color: rgba(216,166,87,0.4); }
  .k { font-size: 12px; color: var(--text-muted); }
  .v { font-size: 20px; font-weight: 600; }
  .v.sm { font-size: 15px; }
  .note { font-size: 12.5px; color: var(--text-secondary); margin: 6px 0 0; }
  .note b { color: var(--text-primary); }
  .cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .led {
    display: grid; grid-template-columns: minmax(0,1.5fr) repeat(3, 62px) 96px;
    gap: 10px; align-items: baseline;
  }
  .led .num { font-family: var(--font-mono); text-align: right; }
  .led-head { color: var(--text-muted); font-size: 11px; }
  .star { color: var(--gold); }
  .mono { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); }
  .flag { color: var(--warn); font-size: 13px; }
  footer { padding: 1.4rem 0 3rem; }
  .empty { color: var(--text-muted); font-size: 13.5px; padding: 1.5rem 0; }
  @media (max-width: 640px) {
    .wrap { padding: 0 1rem; }
    .led { grid-template-columns: 1fr; gap: 2px; }
    .led .num { text-align: left; }
    .led-head { display: none; }
  }
</style>

<div class="topbar"><div class="wrap"><a class="back-link" href="./index.html">← 返回看板</a></div></div>

<header class="hero"><div class="wrap">
  <p class="eyebrow">System Status</p>
  <h1>系統現在在幹嘛</h1>
  <p class="sub">上一跑做了什麼、下一跑什麼時候、四本帳本各有多少、什麼東西停著。
    <b>這一頁只讀不算</b> —— 每個數字都來自它自己的來源檔，這裡不重新判斷任何事。</p>
</div></header>

<div class="wrap"><div id="stale-banner"></div></div>
<main class="wrap" id="body"><p class="empty">載入中…</p></main>
<footer><div class="wrap"><p class="note" id="foot"></p></div></footer>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ⚠️ 這一頁的來源字串**本來就帶 Markdown 的 `**`** —— `audits.json` 的旗標
//    是寫給 log 與 LINE 看的，`status.json` 的 `note` 是我在 LEDGERS 裡寫的。
//    照抄會在畫面上印出兩顆星。M450 在 review.html 修過同一件事，
//    而這一頁**第一版只修了旗標、漏了帳本的 note**，是測試抓到的。
//    **先轉義再換**，所以 XSS 面不變；只認 `**…**`，不做完整 Markdown。
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

// 台北時間；沒有就講「不明」，不要靜默當今天（M439 的規則）
function tpe(iso) {
  if (!iso) return '日期不明';
  const d = new Date(iso);
  if (isNaN(d)) return '日期不明';
  return d.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit' });
}
function ago(iso) {
  if (!iso) return '';
  const h = (Date.now() - new Date(iso)) / 3600000;
  if (isNaN(h)) return '';
  return h < 48 ? `（${h.toFixed(0)} 小時前）` : `（${(h / 24).toFixed(0)} 天前）`;
}

function cell(k, v, note) {
  return `<div class="row"><div class="k">${esc(k)}</div>`
    + `<div class="v">${esc(String(v))}</div>`
    + (note ? `<p class="note">${note}</p>` : '') + `</div>`;
}

// ★★ **「站台停止更新」只能靠看的人的時鐘察覺。**（M578）
//
// 2026-10-16~10-20 站台凍了四天,而這一頁是綠的。`ago()` 一直都在算
// 「（4 天前）」—— **尺早就有,只是它是灰色小字,沒有門檻、沒有改頁面判定。**
// 一個自我回報新鮮度的指標**永遠無法偵測「我停止被發布了」**:檔案說
// 「我是 10-16 的」,頁面就老實印「10-16」,而沒有人說「而今天是 10-20」。
//
// 所以這段**只用兩個東西**:payload 的 `last_updated` ＋ 瀏覽器的時鐘。
// 凡是來自 payload 的判斷在凍結時都一起凍結,唯一還新鮮的是後者。
//
// ⚠️ 為什麼要數**交易日**而不是日曆天:asof 週五、週一休市、週二來看,
// 算日曆天會說「漏跑 2 天」而那是誤報。2026-10-13 我就是這樣把
// 「批次死了五天」寫進三份文件,而實際上那四天裡一個交易日都沒有。
// **「交易日」三個字是這條規則的一半。**
// 休市表由 `status_stage` **預先**寫進 payload（公告表含未來）,所以
// 凍結的 payload 照樣算得準。
function missedTradingDays(d) {
  const iso = d && d.last_updated;
  if (!iso) return null;                     // 判不出來就不喊
  const asof = new Date(iso);
  if (isNaN(asof)) return null;
  // 台北日期（站台的時間基準）。用 sv-SE 拿 YYYY-MM-DD。
  const tpeDate = (x) => x.toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });
  const a = tpeDate(asof), now = tpeDate(new Date());
  const skip = new Set(d.nontrading_weekdays_ahead || []);
  // 休市表拿不到時放寬一天 —— 不確定的時候少喊一次。
  // **天天誤報的警訊會被當成背景噪音,下次真的斷線時沒人會看**（M452）。
  const tol = skip.size ? 0 : 1;
  const missed = [];
  for (let t = new Date(a + 'T00:00:00Z'); ; t.setUTCDate(t.getUTCDate() + 1)) {
    const day = t.toISOString().slice(0, 10);
    if (day <= a) continue;                  // asof 當天不算
    if (day >= now) break;                   // ★ 今天不算 —— 那一跑 14:37 才發生
    const wd = t.getUTCDay();
    if (wd === 0 || wd === 6) continue;      // 週末
    if (skip.has(day)) continue;             // 公告休市
    missed.push(day);
  }
  return { missed, tol, n: Math.max(0, missed.length - tol) };
}

function renderStaleBanner(d) {
  const el = document.getElementById('stale-banner');
  if (!el) return;
  const m = missedTradingDays(d);
  if (!m) {
    el.innerHTML = '<p class="note" style="border-left:3px solid #c80;padding-left:.7em">'
      + '⚠️ <b>判不出這份資料是哪一天的</b>（<span class="mono">last_updated</span> 缺或壞）'
      + ' —— 這不代表系統沒事，是這一頁算不出新鮮度。</p>';
    return;
  }
  if (m.n < 1) { el.innerHTML = ''; return; }
  const days = m.missed.join('、');
  el.innerHTML =
    '<div style="border:2px solid #c0392b;background:rgba(192,57,43,.08);'
    + 'border-radius:8px;padding:14px 16px;margin:14px 0">'
    + `<p style="margin:0 0 .4em;font-weight:700;color:#c0392b;font-size:1.05rem">`
    + `🔴 你現在看到的不是今天的資料 —— 漏了 ${m.n} 個交易日</p>`
    + `<p class="note" style="margin:0">這一頁的資料產生於 <b>${esc(tpe(d.last_updated))}</b>`
    + `${esc(ago(d.last_updated))}，而下列交易日完全沒有產出：<b>${esc(days)}</b>。`
    + `<br><b>站台很可能已經停止更新</b>（2026-10-16~10-20 發生過一次，`
    + `當時這一頁全綠而整站凍了四天）。先查三件事：`
    + `本機排程的 <span class="mono">logs/local_pipeline.log</span> 有 START 沒 END？`
    + `GitHub Actions 是不是紅的？<span class="mono">git log origin/main</span> 有沒有新的快照 commit？`
    + (m.tol ? '<br>（休市表拿不到，門檻已放寬 1 天）' : '')
    + `</p></div>`;
}

function render(d) {
  renderStaleBanner(d);
  const lr = d.last_run || {}, nr = d.next_run || {}, g = d.gate || {};
  const out = [];

  // ── 上一跑
  const failed = lr.n_stage_failure > 0;
  const pr = lr.prev_run || {available: false};
  out.push(`<section><h2>上一跑</h2><div class="grid">`
    + `<div class="row${failed ? ' bad' : ''}">`
    + `<div class="k">開始時間（台北）</div>`
    + `<div class="v sm">${esc(tpe(lr.started_utc))} ${esc(ago(lr.started_utc))}</div>`
    + `<p class="note">`
    + (lr.available === false ? md(lr.reason || '讀不到')
      // M565:`completed` 對「這一跑」結構上答不出來（本檔由最後一個
      //   stage 寫出,pipeline_complete 在它之後才寫）。原本印
      //   「沒有跑完」—— 實測 18/18 跑都是假警報。改成講上一跑。
      : `${pr.available === false ? '這一跑進行中'
          : pr.completed ? '前一跑正常跑完'
          : pr.aborted ? '<b>前一跑中止了</b>'
          : '<b>前一跑沒有完成事件</b>'}`
        + ` · ${lr.n_stage_success} 個 stage 成功`
        + (failed ? ` · <b>${lr.n_stage_failure} 個失敗：${esc((lr.failed_stages || []).join('、'))}</b>` : '')
        + ` · 共 ${lr.total_sec} 秒`)
    + `</p>`
    + ((lr.slowest || []).length
      ? `<p class="note mono">最慢：`
        + lr.slowest.map(s => `${esc(s.stage)} ${s.sec}s`).join('　') + `</p>` : '')
    + `</div></div></section>`);

  // ── 下一跑（★ 名目 vs 實測遲到，兩個都給）
  out.push(`<section><h2>下一跑</h2><div class="grid"><div class="row">`
    + `<div class="k">名目時間（台北）</div>`
    + `<div class="v sm">${esc(nr.nominal_taipei || '—')}</div>`
    + `<p class="note">`
    + (nr.available === false ? md(nr.reason || '')
      : `<b>這是名目，不是實際</b> —— GHA 實測中位遲到 ${nr.median_late_min} 分、`
        + `p90 ${nr.p90_late_min} 分。所以實際大概落在 `
        + `<b>${esc(nr.nominal_taipei || '')} 之後 2~6 小時</b>。`)
    + `</p>`
    + ((nr.skipped_holidays || []).length
      ? `<p class="note">跳過的休市日：<b>${esc(nr.skipped_holidays.join('、'))}</b>`
        + `　—— GHA 的 cron 不知道國定假日，這裡用交易所日曆濾掉</p>` : '')
    + (nr.cron ? `<p class="note mono">cron ${esc(nr.cron)}</p>` : '')
    + `</div></div></section>`);

  // ── 四本帳本
  out.push(`<section><h2>四本帳本</h2><div class="grid">`
    + `<div class="row led led-head"><span>帳本</span>`
    + `<span class="num">持倉</span><span class="num">已平倉</span>`
    + `<span class="num">排隊</span><span class="num">最後一跑</span></div>`
    + (d.ledgers || []).map(l => {
        const star = (l.note || '').startsWith('★');
        return `<div class="row"><div class="led">`
          + `<span${star ? ' class="star"' : ''}><b>${esc(l.label)}</b></span>`
          + `<span class="num">${l.available === false ? '—' : l.open}</span>`
          + `<span class="num">${l.available === false ? '—' : l.closed}</span>`
          + `<span class="num">${l.available === false ? '—' : l.pending}</span>`
          + `<span class="num">${esc(l.last_run_date || '—')}</span></div>`
          + `<p class="note">${md(l.note)}</p></div>`;
      }).join('')
    + `</div></section>`);

  // ── Phase 2
  const paused = (d.clocks || []).length > 0;
  out.push(`<section><h2>Phase 2</h2><div class="cells">`
    + cell('成熟已平倉', `${g.n_mature_closed ?? '—'}/${g.target_closed ?? 60}`,
           '成熟 = 進場日 + max_hold_days ≤ 今天')
    + cell('眼睛', esc(g.life_state || '—'),
           'closed = 時鐘暫停中；綁判決不綁筆數')
    + cell('起算日', esc(g.since || '—'), 'PRE-REG §21.3')
    + cell('帳本落後', g.ledger_lag_days == null ? '—' : `${g.ledger_lag_days} 天`,
           '週批次最多延遲一週（§21.4 已知代價）')
    + `</div>`
    + `<p class="note" style="margin-top:10px">分子來自 <b>${esc(g.ledger || '—')}</b></p>`
    + `</section>`);

  // ── 刻意停著的
  out.push(`<section><h2>刻意停著的</h2>`
    + (paused
      ? `<div class="grid">` + d.clocks.map(c =>
          `<div class="row warn"><div class="k">${esc(c.label)}</div>`
          + `<div class="v sm">自 ${esc(c.paused_since)} 暫停</div>`
          + `<p class="note">解除條件：${esc(c.unlock_section)}`
          + `　—— <b>停著是一個決定，不是壞掉</b></p></div>`).join('')
        + `</div>`
      : `<p class="empty">沒有東西停著。</p>`)
    + `</section>`);

  // ── 稽核旗標（照抄，不重判）
  const flags = d.audit_flags || [];
  out.push(`<section><h2>今日稽核旗標</h2>`
    + (flags.length
      // ⚠️ 旗標字串本來就帶 Markdown 的 `**`（audits.json 是給 log 與 LINE
      //    用的）。照抄會在畫面上印出字面星號 —— M450 在 review.html 修過
      //    同一件事。這裡只轉 `**…**`，不做完整 Markdown：轉義之後再換，
      //    所以 XSS 面不變。
      ? `<div class="grid">` + flags.map(f =>
          `<div class="row warn"><p class="flag">`
          + md(String(f))
          + `</p></div>`).join('')
        + `</div>`
      : `<p class="empty">沒有旗標。</p>`)
    + `<p class="note" style="margin-top:10px">`
    + `照抄 <span class="mono">audits.json</span>（${esc(d.audits_as_of || '日期不明')} 算的），`
    + `<b>這裡不重新判斷</b> —— 重判會出現同一件事兩個答案。</p>`
    + `</section>`);

  // ── 資料健康
  const h = d.health || {}, hs = h.summary || {};
  out.push(`<section><h2>資料健康</h2><div class="cells">`
    + cell('宇宙檔數', hs.universe_size ?? '—', '')
    + cell('抓取成功率',
           hs.success_rate == null ? '—' : `${(hs.success_rate * 100).toFixed(1)}%`,
           `失敗 ${hs.failed ?? '—'} 檔`)
    + cell('品質旗標', h.n_quality_flags ?? '—', '')
    + `</div><p class="note" style="margin-top:10px">`
    + `${esc(tpe(h.as_of))} ${esc(ago(h.as_of))}</p></section>`);

  document.getElementById('body').innerHTML = out.join('');
  document.getElementById('foot').innerHTML =
    `產生於 ${esc(tpe(d.last_updated))}`
    + ((d.missing || []).length
      ? `　⚠️ 有 ${d.missing.length} 份來源讀不到：<b>${esc(d.missing.join('、'))}</b>`
      : '')
    + `<br>${md(d.note || '')}`;
}

(async () => {
  try {
    const r = await fetch('./status.json?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    // 讀不到就講讀不到 —— 靜默空白會被讀成「系統沒事」
    document.getElementById('body').innerHTML =
      `<p class="empty">讀不到 <span class="mono">status.json</span>（${esc(e.message)}）`
      + `　—— 先跑 <span class="mono">py src/status_stage.py</span>。`
      + `<br><b>這不代表系統沒事，是這一頁自己拿不到資料。</b></p>`;
  }
})();
</script>
