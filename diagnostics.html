<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易診斷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* M151(2026-09-01):字體系統跟全站一致(IBM Plex Sans + Mono + 思源黑體) */
  :root {
    --bg-page: #000; --bg-card: #0D0D0D; --bg-card-hover: #141414;
    --text-primary: #F2F0EA; --text-secondary: #9C9A93; --text-muted: #63615A;
    --accent: #CBBFA8; --gold: var(--accent);
    --success: #3FA66B; --danger: #E0473F;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.18);
    --font-display: 'IBM Plex Sans', 'Noto Sans TC', sans-serif;
    --font-text: 'IBM Plex Sans', 'Noto Sans TC', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Noto Sans TC', ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  .mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  body {
    margin: 0; background: var(--bg-page); color: var(--text-primary);
    font-family: var(--font-text);
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
  .topbar { border-bottom: 1px solid var(--border); padding: 1rem 0; }
  .back-link {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--text-secondary); text-decoration: none; font-size: 13px;
  }
  .back-link:hover { color: var(--gold); }

  header.hero { border-bottom: 1px solid var(--border); padding: 2.4rem 0 2rem; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-muted); margin: 0 0 0.6rem;
  }
  h1 { font-size: 26px; margin: 0 0 0.7rem; font-weight: 700; }
  .sub { color: var(--text-secondary); font-size: 14px; margin: 0; max-width: 62ch; }
  .disclaimer {
    margin: 1rem 0 0; padding: 0.8rem 1rem; font-size: 12px;
    color: var(--text-muted); background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .disclaimer ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }
  .disclaimer li { margin: 0.25rem 0; }

  section.block { padding: 2rem 0; border-bottom: 1px solid var(--border); }
  h2 { font-size: 16px; margin: 0 0 0.3rem; }
  .sec-note { color: var(--text-secondary); font-size: 12.5px; margin: 0 0 1.2rem; max-width: 72ch; }
  .stat-row { display: flex; gap: 1.6rem; flex-wrap: wrap; margin: 0 0 1rem; }
  .stat { }
  .stat .k { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); display: block; }
  .stat .v { font-size: 20px; font-weight: 700; }
  .v.warn { color: var(--danger); } .v.ok { color: var(--success); }

  .empty-note {
    color: var(--text-muted); font-size: 13px; padding: 1.2rem;
    border: 1px dashed var(--border-strong); border-radius: 8px; text-align: center;
  }
  .chart-scroll { overflow-x: auto; }
  svg { display: block; max-width: 100%; }
  .kwrap svg { width: 100%; height: auto; }
  .legend { display: flex; gap: 1.2rem; font-size: 11.5px; color: var(--text-secondary); margin-top: 0.6rem; flex-wrap: wrap; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-left-width: 3px; border-radius: 10px; padding: 1rem 1.1rem;
  }
  .card-win { border-left-color: var(--success); }
  .card-loss { border-left-color: var(--danger); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card-head h3 { font-size: 14px; margin: 0; }
  .card-head .code { color: var(--text-muted); font-size: 11px; }
  .card-ret { font-size: 17px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 700; border: 1px solid var(--border-strong);
    color: var(--text-secondary);
  }
  .badge.recon { color: var(--text-muted); }
  .badge.dev { color: var(--danger); border-color: var(--danger); }
  .card-meta { font-size: 11.5px; color: var(--text-secondary); margin: 7px 0 8px; line-height: 1.7; }
  .badge-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
  .badge-row .strat { font-weight: 600; color: var(--text-primary); }
  .dev-inline { color: var(--danger); }
  .klegend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10px; color: var(--text-muted); margin-top: 5px; }
  .klegend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .klegend i.dashed { width: 10px; height: 0; border-top: 1.5px dashed; background: none !important; border-radius: 0; }
  .kline-missing {
    font-size: 11px; color: var(--text-muted); text-align: center;
    padding: 1.6rem 1rem; border: 1px dashed var(--border-strong); border-radius: 8px;
  }
  .kline-missing span { color: var(--text-muted); opacity: 0.7; font-style: italic; }
  .checks { font-size: 11.5px; margin: 8px 0 0; }
  .checks .row { display: flex; gap: 6px; padding: 2px 0; }
  .checks .mk { width: 1em; }
  .checks .pass { color: var(--success); } .checks .fail { color: var(--danger); }
  .checks .actual { color: var(--text-muted); margin-left: auto; }
  .kwrap { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }
  .clip-note { font-size: 10px; color: var(--text-muted); font-style: italic; margin-top: 4px; }
  footer { padding: 2rem 0 3rem; color: var(--text-muted); font-size: 11px; }
</style>
</head>
<body>
<div class="topbar"><div class="wrap"><a class="back-link" href="./review.html">← 覆盤與除錯中心</a></div></div>

<header class="hero"><div class="wrap">
  <h1>交易診斷</h1>
  <p class="sub">現階段只做 deviation 監控(n=1 就有意義):規則有沒有被執行。不做績效統計(n 少會誤導)。資料由 <span>python scripts/run_trade_diagnostics.py</span> 產生,不進版控、不隨每日 pipeline 自動更新。</p>
  <div class="disclaimer" id="disclaimers"></div>
</div></header>

<div id="loading" class="wrap" style="padding:2rem 0;color:var(--text-muted);">正在讀取 diagnostics.json…</div>
<div id="content" style="display:none;">

  <section class="block"><div class="wrap">
    <h2>1 · Deviation 時間軸</h2>
    <p class="sec-note" id="dev-note"></p>
    <div class="stat-row" id="dev-stats"></div>
    <div id="dev-chart"></div>
  </div></section>

  <section class="block"><div class="wrap">
    <h2>2 · MFE 回吐散點</h2>
    <p class="sec-note" id="mfe-note"></p>
    <div class="stat-row" id="mfe-stats"></div>
    <div class="chart-scroll" id="mfe-chart"></div>
  </div></section>

  <section class="block"><div class="wrap">
    <h2>3 · 持倉天數分佈</h2>
    <p class="sec-note" id="hd-note"></p>
    <div class="stat-row" id="hd-stats"></div>
    <div class="chart-scroll" id="hd-chart"></div>
  </div></section>

  <section class="block"><div class="wrap">
    <h2>4 · K 線決策還原</h2>
    <p class="sec-note" id="kl-note"></p>
    <div class="stat-row" id="kl-summary"></div>
    <div class="cards" id="kl-cards"></div>
  </div></section>

  <footer><div class="wrap" id="foot"></div></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (v, d=2) => v == null ? '—' : (v >= 0 ? '+' : '') + Number(v).toFixed(d) + '%';
const NS = 'http://www.w3.org/2000/svg';
function svg(w, h) { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.setAttribute('width', w); s.setAttribute('height', h); return s; }
function el(tag, attrs, text) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
const C = { grid:'rgba(255,255,255,0.09)', axis:'#63615A', text:'#9C9A93', ok:'#3FA66B', bad:'#E0473F', gold:'#CBBFA8', muted:'#63615A', ma:'#6E8FB8' };

// M186:詞彙對齊 config/settings.yaml exit_vocab(見 journal.html 說明)。
const EXIT_LABEL = {
  stop_loss: '風險停損', risk_stop: '風險停損',
  trailing_stop: '移動停損', take_profit_1x: '移動停損（舊樣本）', profit_protection: '移動停損',
  time_exit: '持有到期', structure_breakdown: '結構破壞',
  momentum_weakening: '動能轉弱', regime_change: '市場環境轉變', thesis_invalidated: '進場論點失效',
};
const STRAT_LABEL = { breakout: '創新高爆量', pullback: '貼均線量縮', tv004_smc_choch: '空頭轉多·結構突破' };
const exitLabel = r => r ? (EXIT_LABEL[r] || r) : '—';
const stratLabel = s => s ? (STRAT_LABEL[s] || s) : '';

fetch('./diagnostics.json?t=' + Date.now()).then(r => {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}).then(render).catch(err => {
  $('#loading').innerHTML = `讀不到 <span>docs/diagnostics.json</span> —— 先在 repo 根目錄跑 <span>python scripts/run_trade_diagnostics.py</span>。<br><span style="color:var(--text-muted)">(${esc(err.message)})</span>`;
});

function render(d) {
  $('#loading').style.display = 'none';
  $('#content').style.display = '';

  $('#disclaimers').innerHTML = '誠實邊界<ul>' + (d.disclaimers || []).map(x => `<li>${esc(x)}</li>`).join('') + '</ul>';

  renderDeviation(d.deviation_timeline || {});
  renderMfe(d.mfe_giveback || {});
  renderHoldDays(d.hold_days_distribution || {});
  renderKlines(d.kline_reconstructions || {});

  $('#foot').innerHTML = `平倉 ${d.n_closed_total || 0} 筆(v2 ${d.n_v2 || 0} 筆)· 產生時間 ${esc((d.metadata && d.metadata.generated_at) || d.last_updated || '—')}`;
}

/* ---------- 1. Deviation 時間軸 ---------- */
function renderDeviation(dt) {
  $('#dev-note').textContent = dt.note || '';
  const rows = dt.rows || [];
  $('#dev-stats').innerHTML = [
    ['v2 平倉', dt.n || 0, ''],
    ['deviation', dt.n_deviation || 0, (dt.n_deviation || 0) > 0 ? 'warn' : 'ok'],
    ['deviation 率', dt.deviation_rate_pct == null ? '—' : dt.deviation_rate_pct + '%', ''],
  ].map(([k, v, c]) => `<div class="stat"><span class="k">${k}</span><span class="v ${c}">${v}</span></div>`).join('');

  const box = $('#dev-chart');
  if (!rows.length) { box.innerHTML = `<div class="empty-note">${esc(dt.note || '尚無 v2 平倉紀錄。')}</div>`; return; }

  const W = Math.max(680, rows.length * 46 + 80), H = 200, padL = 44, padB = 46, padT = 16;
  const s = svg(W, H);
  const x = i => padL + (rows.length === 1 ? (W - padL - 20) / 2 : i * (W - padL - 30) / (rows.length - 1));
  s.appendChild(el('line', { x1: padL, y1: H - padB, x2: W - 10, y2: H - padB, stroke: C.axis }));
  s.appendChild(el('line', { x1: padL, y1: padT, x2: padL, y2: H - padB, stroke: C.axis }));
  ['planned = actual', 'deviation'].forEach((lbl, i) => {
    const yy = padT + 30 + i * 60;
    s.appendChild(el('text', { x: 6, y: yy + 4, fill: C.text, 'font-size': 9 }, i ? 'DEVIATE' : 'OK'));
    s.appendChild(el('line', { x1: padL, y1: yy, x2: W - 10, y2: yy, stroke: C.grid, 'stroke-dasharray': '2 3' }));
  });
  rows.forEach((r, i) => {
    const yy = padT + 30 + (r.deviation ? 60 : 0);
    const g = el('g', {});
    g.appendChild(el('circle', { cx: x(i), cy: yy, r: 6, fill: r.deviation ? C.bad : C.ok }));
    g.appendChild(el('text', { x: x(i), y: H - padB + 14, fill: C.text, 'font-size': 8.5, 'text-anchor': 'middle' }, r.ticker || ''));
    g.appendChild(el('text', { x: x(i), y: H - padB + 25, fill: C.muted, 'font-size': 8, 'text-anchor': 'middle' }, (r.exit_date || '').slice(5)));
    const t = el('title', {}, `${r.name || r.ticker} ${r.strategy}\n進 ${r.entry_date} → 出 ${r.exit_date}\nplanned: ${r.planned_exit_reason}\nactual: ${r.exit_reason_v2}\n結構破壞日: ${r.structure_break_date || '—'}${r.days_break_to_exit != null ? ` (破壞後 ${r.days_break_to_exit} 天才出場)` : ''}\n報酬 ${pct(r.return_pct)}`);
    g.appendChild(t);
    s.appendChild(g);
  });
  box.innerHTML = '';
  const sc = document.createElement('div'); sc.className = 'chart-scroll'; sc.appendChild(s); box.appendChild(sc);
  box.insertAdjacentHTML('beforeend', `<div class="legend"><span><span class="dot" style="background:${C.ok}"></span>planned = actual</span><span><span class="dot" style="background:${C.bad}"></span>deviation(planned ≠ actual)</span></div>`);
}

/* ---------- 2. MFE 回吐散點 ---------- */
function renderMfe(mg) {
  $('#mfe-note').textContent = mg.note || '';
  const rows = (mg.rows || []).filter(r => !r.insufficient && r.mfe_pct != null && r.final_return_pct != null);
  const worst = rows.filter(r => (r.giveback_pct || 0) >= 10).length;
  $('#mfe-stats').innerHTML = [
    ['有效樣本', rows.length, ''],
    ['缺本機歷史', mg.n_missing_history || 0, ''],
    ['回吐 ≥ 10pp', worst, worst > 0 ? 'warn' : ''],
  ].map(([k, v, c]) => `<div class="stat"><span class="k">${k}</span><span class="v ${c}">${v}</span></div>`).join('');

  const box = $('#mfe-chart');
  if (!rows.length) { box.innerHTML = `<div class="empty-note">沒有算得出 MFE 的樣本(本機 docs/stocks 歷史不足)。</div>`; return; }

  const W = 640, H = 420, pad = 52;
  const xs = rows.map(r => r.mfe_pct), ys = rows.map(r => r.final_return_pct);
  const xMax = Math.max(5, ...xs) * 1.1, yMin = Math.min(-5, ...ys) * 1.1, yMax = Math.max(5, ...ys, xMax) * 1.05;
  const X = v => pad + v / xMax * (W - pad - 20);
  const Y = v => H - pad - (v - yMin) / (yMax - yMin) * (H - pad - 20);
  const s = svg(W, H);
  // axes
  s.appendChild(el('line', { x1: pad, y1: Y(yMin), x2: W - 10, y2: Y(yMin), stroke: C.axis }));
  s.appendChild(el('line', { x1: pad, y1: 12, x2: pad, y2: H - pad, stroke: C.axis }));
  if (yMin < 0) s.appendChild(el('line', { x1: pad, y1: Y(0), x2: W - 10, y2: Y(0), stroke: C.grid }));
  // 對角線 final == mfe(完美不回吐)
  s.appendChild(el('line', { x1: X(0), y1: Y(0), x2: X(xMax), y2: Y(xMax), stroke: C.gold, 'stroke-dasharray': '4 4', opacity: 0.5 }));
  s.appendChild(el('text', { x: X(xMax) - 4, y: Y(xMax) - 6, fill: C.gold, 'font-size': 9, 'text-anchor': 'end', opacity: 0.7 }, '零回吐線'));
  s.appendChild(el('text', { x: (W) / 2, y: H - 12, fill: C.text, 'font-size': 10, 'text-anchor': 'middle' }, '期間最大未實現獲利 MFE (%)'));
  s.appendChild(el('text', { x: 14, y: H / 2, fill: C.text, 'font-size': 10, 'text-anchor': 'middle', transform: `rotate(-90 14 ${H / 2})` }, '最終報酬 (%)'));
  [0, 10, 20, 30].filter(v => v <= xMax).forEach(v => {
    s.appendChild(el('text', { x: X(v), y: Y(yMin) + 14, fill: C.muted, 'font-size': 8.5, 'text-anchor': 'middle' }, v));
  });
  rows.forEach(r => {
    const g = el('g', {});
    const big = (r.giveback_pct || 0) >= 10;
    g.appendChild(el('circle', { cx: X(r.mfe_pct), cy: Y(r.final_return_pct), r: big ? 5 : 3.5, fill: big ? C.bad : C.gold, opacity: big ? 0.9 : 0.6 }));
    g.appendChild(el('title', {}, `${r.name || r.ticker} ${r.strategy}\n出場 ${r.exit_date}\nMFE ${pct(r.mfe_pct)}  最終 ${pct(r.final_return_pct)}\n回吐 ${r.giveback_pct == null ? '—' : r.giveback_pct + ' pp'}`));
    s.appendChild(g);
  });
  box.innerHTML = ''; box.appendChild(s);
  box.insertAdjacentHTML('beforeend', `<div class="legend"><span><span class="dot" style="background:${C.gold}"></span>一般</span><span><span class="dot" style="background:${C.bad}"></span>回吐 ≥ 10 個百分點</span><span>離對角線越遠下方 = 吐回去越多</span></div>`);
}

/* ---------- 3. 持倉天數分佈 ---------- */
function renderHoldDays(hd) {
  $('#hd-note').textContent = hd.note || '';
  const hist = hd.histogram || [];
  $('#hd-stats').innerHTML = [
    ['已平倉', hd.n || 0, ''],
    ['time_exit', hd.n_time_exit || 0, ''],
    ['max_hold', (hd.max_hold_day_lines || []).join(' / ') || '—', ''],
  ].map(([k, v, c]) => `<div class="stat"><span class="k">${k}</span><span class="v ${c}">${v}</span></div>`).join('');

  const box = $('#hd-chart');
  if (!hist.length) { box.innerHTML = `<div class="empty-note">沒有帶 days_held 的平倉紀錄。</div>`; return; }

  const maxDay = Math.max(...hist.map(h => h.days), ...(hd.max_hold_day_lines || [0]));
  const maxCnt = Math.max(...hist.map(h => h.count));
  const bw = 26, gap = 6, padL = 40, padB = 34, padT = 14, H = 240;
  const W = Math.max(560, padL + (maxDay + 1) * (bw + gap) + 20);
  const X = day => padL + day * (bw + gap);
  const Y = c => H - padB - c / maxCnt * (H - padB - padT);
  const s = svg(W, H);
  s.appendChild(el('line', { x1: padL, y1: H - padB, x2: W - 10, y2: H - padB, stroke: C.axis }));
  const byDay = {}; hist.forEach(h => byDay[h.days] = h.count);
  for (let day = 1; day <= maxDay; day++) {
    const c = byDay[day] || 0;
    if (c) {
      s.appendChild(el('rect', { x: X(day), y: Y(c), width: bw, height: (H - padB) - Y(c), fill: C.gold, opacity: 0.75 }));
      s.appendChild(el('text', { x: X(day) + bw / 2, y: Y(c) - 4, fill: C.text, 'font-size': 9, 'text-anchor': 'middle' }, c));
    }
    if (day % 2 === 1 || day === maxDay)
      s.appendChild(el('text', { x: X(day) + bw / 2, y: H - padB + 14, fill: C.muted, 'font-size': 8.5, 'text-anchor': 'middle' }, day));
  }
  (hd.max_hold_day_lines || []).forEach(ml => {
    const xx = X(ml) + bw / 2;
    s.appendChild(el('line', { x1: xx, y1: padT - 4, x2: xx, y2: H - padB, stroke: C.bad, 'stroke-dasharray': '3 3' }));
    s.appendChild(el('text', { x: xx + 4, y: padT + 4, fill: C.bad, 'font-size': 8.5 }, `max_hold ${ml}`));
  });
  box.innerHTML = ''; box.appendChild(s);
}

/* ---------- 4. K 線決策還原 ---------- */
function renderKlines(kl) {
  $('#kl-note').textContent = kl.note || '';
  const cards = kl.cards || [];
  const sumBox = $('#kl-summary');
  const box = $('#kl-cards');
  if (!cards.length) { sumBox.innerHTML = ''; box.innerHTML = `<div class="empty-note">沒有平倉紀錄。</div>`; return; }

  // 摘要條:先給結論,再往下看逐筆。這裡是「規則有沒有被執行」的觀測,不是績效宣稱。
  const n = cards.length;
  const wins = cards.filter(c => Number(c.return_pct) >= 0).length;
  const givebacks = cards.map(c => c.mfe_pct != null && c.return_pct != null ? c.mfe_pct - c.return_pct : null).filter(v => v != null && v >= 0);
  const avgGiveback = givebacks.length ? givebacks.reduce((a, b) => a + b, 0) / givebacks.length : null;
  const deviations = cards.filter(c => c.deviation).length;
  const noHist = cards.filter(c => !(c.window && c.window.length >= 3)).length;
  sumBox.innerHTML = [
    ['逐筆卡片', n, ''],
    ['收正 / 收負', `${wins} / ${n - wins}`, ''],
    ['平均 MFE 回吐', avgGiveback == null ? '—' : avgGiveback.toFixed(1) + ' pp', avgGiveback != null && avgGiveback >= 8 ? 'warn' : ''],
    ['deviation', deviations, deviations > 0 ? 'warn' : 'ok'],
    ['本機無歷史', noHist, ''],
  ].map(([k, v, cl]) => `<div class="stat"><span class="k">${k}</span><span class="v ${cl}">${v}</span></div>`).join('');

  box.innerHTML = '';
  cards.forEach(c => box.appendChild(klineCard(c)));
}

function klineCard(c) {
  const div = document.createElement('div');
  const win = Number(c.return_pct) >= 0;
  div.className = 'card ' + (win ? 'card-win' : 'card-loss');
  const badges = [];
  badges.push(`<span class="badge ${c.mode === 'reconstructed' ? 'recon' : ''}">${c.mode === 'reconstructed' ? '事後重建' : '當時存下'}</span>`);
  if (c.deviation) badges.push('<span class="badge dev">紀律偏離</span>');

  const planned = exitLabel(c.planned_exit_reason);
  const actual = exitLabel(c.exit_reason_v2 || c.exit_reason);
  const giveback = (c.mfe_pct != null && c.return_pct != null) ? (c.mfe_pct - c.return_pct) : null;

  div.innerHTML = `
    <div class="card-head">
      <h3>${esc(c.name || c.ticker)} <span class="code">${esc(c.ticker)}</span></h3>
      <span class="card-ret" style="color:${win ? C.ok : C.bad}">${pct(c.return_pct)}</span>
    </div>
    <div class="card-meta">
      <div class="badge-row">${badges.join(' ')} <span class="strat">${esc(stratLabel(c.strategy))}</span></div>
      進 ${esc(c.entry_date)} → 出 ${esc(c.exit_date)} · 持有 ${esc(c.days_held)} 天<br>
      出場理由:${esc(actual)}${planned !== '—' && planned !== actual ? ` <span class="dev-inline">(紀律應為 ${esc(planned)})</span>` : ''}
      ${c.structure_break_date ? `<br>結構破壞日 ${esc(c.structure_break_date)}` : ''}
      ${c.mfe_pct != null ? `<br>期間最高 ${pct(c.mfe_pct)}(第 ${esc(c.days_to_mfe)} 天)${giveback != null ? ` · 回吐 ${giveback.toFixed(1)} pp` : ''}` : ''}
    </div>`;

  if (c.trigger_checks && c.trigger_checks.length) {
    const ch = document.createElement('div');
    ch.className = 'checks';
    ch.innerHTML = c.trigger_checks.map(t =>
      `<div class="row"><span class="mk ${t.pass ? 'pass' : 'fail'}">${t.pass ? '✓' : '✗'}</span><span>${esc(t.label)}</span><span class="actual">${esc(t.actual)}</span></div>`
    ).join('');
    div.appendChild(ch);
  }

  const kw = document.createElement('div');
  kw.className = 'kwrap';
  if (c.window && c.window.length >= 3) {
    kw.appendChild(candleSvg(c));
    kw.insertAdjacentHTML('beforeend',
      `<div class="klegend">`
      + `<span><i style="background:${C.gold}"></i>進場</span>`
      + `<span><i style="background:${C.ma}"></i>MA20</span>`
      + `<span><i style="background:${C.bad}"></i>初始停損</span>`
      + `<span><i style="background:${C.ok}"></i>移停啟動</span>`
      + (c.mfe_pct != null ? `<span><i class="dashed" style="border-color:${C.gold}"></i>期間最高</span>` : '')
      + `</div>`);
    if (c.clipped_pre || c.clipped_post) {
      kw.insertAdjacentHTML('beforeend', `<div class="clip-note">${c.clipped_pre ? '進場前脈絡被本機 60 根歷史截斷。' : ''}${c.clipped_post ? ' 出場後 20 根不完整。' : ''}${c.window_note ? esc(c.window_note) : ''}</div>`);
    }
  } else {
    kw.innerHTML = `<div class="kline-missing">${esc(c.window_note || '本機沒有這檔的歷史(可能已下市 / 不在 universe),畫不出 K 線。')}</div>`;
  }
  div.appendChild(kw);
  return div;
}

// 一根收盤的 20 日均線(視窗前段不足 20 根 → null)。structure_breakdown 出場
// 的定義就是「收盤跌破 MA20」,所以這條線是判讀這頁的基準。
function ma20(bars) {
  return bars.map((_, i) => {
    if (i < 19) return null;
    let s = 0; for (let j = i - 19; j <= i; j++) s += bars[j].close;
    return s / 20;
  });
}

function candleSvg(c) {
  const bars = c.window;
  const W = 560, H = 250, padL = 6, padR = 56, padT = 20, padB = 28;
  const dateIdx = {}; bars.forEach((b, i) => dateIdx[b.date] = i);
  const ei = dateIdx[c.entry_date], xi = dateIdx[c.exit_date];
  const mfeIdx = c.mfe_date != null ? dateIdx[c.mfe_date] : null;
  const maeIdx = c.mae_date != null ? dateIdx[c.mae_date] : null;
  const sbIdx = c.structure_break_date != null ? dateIdx[c.structure_break_date] : null;
  const ma = ma20(bars);
  const mfePrice = (c.mfe_pct != null && c.entry_price) ? c.entry_price * (1 + c.mfe_pct / 100) : null;

  const vals = [
    ...bars.map(b => b.low), ...bars.map(b => b.high),
    c.stop_loss, c.take_profit_1x, c.entry_price, c.exit_price, mfePrice,
    ...ma.filter(v => v != null),
  ].filter(v => v != null);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.04 || 1;
  const Y = v => padT + (hi + pad - v) / (hi - lo + 2 * pad) * (H - padT - padB);
  const bw = (W - padL - padR) / bars.length;
  const X = i => padL + i * bw + bw / 2;
  const s = svg(W, H);

  // holding band
  if (ei != null && xi != null) {
    s.appendChild(el('rect', {
      x: padL + Math.min(ei, xi) * bw, y: padT, width: Math.max((Math.abs(xi - ei) + 1) * bw, bw),
      height: H - padT - padB, fill: (Number(c.return_pct) >= 0 ? C.ok : C.bad), opacity: 0.09,
    }));
  }
  // structure-break vertical line
  if (sbIdx != null) {
    s.appendChild(el('line', { x1: X(sbIdx), y1: padT, x2: X(sbIdx), y2: H - padB, stroke: C.bad, 'stroke-width': 1, 'stroke-dasharray': '2 3', opacity: 0.7 }));
    s.appendChild(el('text', { x: X(sbIdx), y: padT - 6, fill: C.bad, 'font-size': 9, 'text-anchor': 'middle' }, '破壞'));
  }
  // MA20
  const pts = ma.map((v, i) => v == null ? null : `${X(i)},${Y(v)}`).filter(Boolean).join(' ');
  if (pts) s.appendChild(el('polyline', { points: pts, fill: 'none', stroke: C.ma, 'stroke-width': 1.2, opacity: 0.85 }));

  // level lines with right-side labels
  const lvl = (v, col, dash, label) => {
    if (v == null) return;
    s.appendChild(el('line', { x1: padL, y1: Y(v), x2: W - padR, y2: Y(v), stroke: col, 'stroke-width': 1, 'stroke-dasharray': dash, opacity: 0.6 }));
    s.appendChild(el('text', { x: W - padR + 4, y: Y(v) + 3, fill: col, 'font-size': 9 }, label + ' ' + Number(v).toFixed(1)));
  };
  lvl(c.entry_price, C.gold, '', '進');
  lvl(c.stop_loss, C.bad, '3 2', '停損');
  lvl(c.take_profit_1x, C.ok, '3 2', '移停');
  if (mfePrice != null) lvl(mfePrice, C.gold, '1 3', 'MFE');

  // candles
  bars.forEach((b, i) => {
    const up = b.close >= b.open;
    const col = up ? C.ok : C.bad;
    s.appendChild(el('line', { x1: X(i), y1: Y(b.high), x2: X(i), y2: Y(b.low), stroke: col, 'stroke-width': 1 }));
    const yo = Y(b.open), yc = Y(b.close);
    s.appendChild(el('rect', { x: X(i) - bw * 0.32, y: Math.min(yo, yc), width: Math.max(bw * 0.64, 1), height: Math.max(Math.abs(yc - yo), 1), fill: col, opacity: up ? 0.9 : 1 }));
  });

  // x-axis date ticks
  const nTicks = Math.min(5, bars.length);
  for (let t = 0; t < nTicks; t++) {
    const i = Math.round(t * (bars.length - 1) / (nTicks - 1));
    s.appendChild(el('text', { x: X(i), y: H - padB + 14, fill: C.muted, 'font-size': 8.5, 'text-anchor': 'middle' }, (bars[i].date || '').slice(5)));
  }

  // MFE peak / MAE trough / entry / exit markers
  const mark = (idx, price, sym, col, below, label) => {
    if (idx == null || price == null) return;
    const y = Y(price) + (below ? 14 : -7);
    s.appendChild(el('text', { x: X(idx), y, fill: col, 'font-size': 12, 'text-anchor': 'middle', 'font-weight': 700 }, sym));
    if (label) s.appendChild(el('text', { x: X(idx), y: y + (below ? 10 : -10), fill: col, 'font-size': 8.5, 'text-anchor': 'middle' }, label));
  };
  if (mfeIdx != null) mark(mfeIdx, bars[mfeIdx].high, '△', C.gold, false, '最高');
  if (maeIdx != null) mark(maeIdx, bars[maeIdx].low, '▽', C.bad, true, '最低');
  mark(ei, c.entry_price, '▲', C.gold, true, '進');
  mark(xi, c.exit_price, '▼', '#F2F0EA', false, '出');
  return s;
}
</script>
