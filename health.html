<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料健康儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #000000;
    --bg-card: #0D0D0D;
    --bg-card-hover: #141414;
    --text-primary: #F2F0EA;
    --text-secondary: #9C9A93;
    --text-muted: #63615A;
    /* 2026-08-18:跟 index.html/stock.html 對齊——那兩頁在 662250c 那次改版
       把主色從飽和金 #D4AF37 換成香檳鉑金 #CBBFA8(理由:飽和金太搶眼,蓋過內容),
       這頁當時漏改,三個頁面同一個變數名稱卻長不同顏色。 */
    --accent: #CBBFA8;
    --gold: var(--accent);
    --success: #3FA66B;
    --danger: #E0473F;
    /* UI_SPEC 第一項:這頁目前沒有漲跌/損益顯示,加這兩個變數只是保持三個
       頁面共用的設計token一致,不是這頁現在就要用到。 */
    --pnl-up: #3FA66B;
    --pnl-down: #E0473F;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .voice { font-family: 'Fraunces', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 2rem; }

  .topbar { border-bottom: 1px solid var(--border); padding: 1rem 0; }

  .back-link {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--text-secondary); text-decoration: none; font-size: 13px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--gold); }

  header.hero {
    padding: 2rem 0 1.75rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  header.hero::after {
    content: ''; position: absolute; bottom: -1px; left: 0;
    width: 48px; height: 2px; background: var(--gold);
  }

  .eyebrow {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 0.5rem;
  }

  header.hero h1 {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 30px;
    margin: 0 0 0.4rem; letter-spacing: -0.01em;
  }

  header.hero .sub { color: var(--text-secondary); font-size: 13.5px; margin: 0; }

  section { padding: 2rem 0; border-bottom: 1px solid var(--border); }

  .section-title {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-muted); margin: 0 0 1.1rem;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .metric { background: var(--bg-card); padding: 1.1rem 1.2rem; }
  .metric-label {
    font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-muted); display: block; margin-bottom: 6px;
  }
  .metric-val { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; }
  .metric-val.ok { color: var(--success); }
  .metric-val.warn { color: var(--gold); }
  .metric-val.bad { color: var(--danger); }

  .status-banner {
    display: flex; align-items: center; gap: 10px;
    padding: 0.85rem 1.1rem;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 1.5rem;
    border: 1px solid transparent;
  }
  .status-banner.ok { background: rgba(63,166,107,0.1); border-color: rgba(63,166,107,0.35); color: #B9E4C9; }
  .status-banner.warn { background: rgba(212,175,55,0.08); border-color: rgba(212,175,55,0.3); color: #E8DCB0; }
  .status-banner .mark { font-family: 'Fraunces', serif; font-weight: 700; }
  .status-banner.ok .mark { color: var(--success); }
  .status-banner.warn .mark { color: var(--gold); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 500; padding: 0 0 8px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.ticker-cell { font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  td.ticker-cell a { color: var(--gold); text-decoration: none; }
  td.ticker-cell a:hover { text-decoration: underline; }
  td.reason-cell { color: var(--text-secondary); }
  td.stage-cell { color: var(--text-muted); font-size: 11.5px; white-space: nowrap; }

  .empty-note {
    color: var(--text-muted); font-size: 13px; padding: 1rem 0;
  }
  .empty-note .mark { color: var(--success); margin-right: 6px; }

  #loading { text-align: center; padding: 5rem 2rem; color: var(--text-secondary); }
  #error-box { display: none; text-align: center; padding: 5rem 2rem; color: var(--text-secondary); }
  #content { display: none; }

  footer { text-align: center; color: var(--text-muted); font-size: 11.5px; padding: 2.5rem 2rem; }

  @media (max-width: 680px) {
    .wrap { padding: 0 1.1rem; }
    header.hero h1 { font-size: 23px; }
    .metric-val { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="topbar"><div class="wrap"><a class="back-link" href="./index.html">← 返回看板</a></div></div>

<header class="hero"><div class="wrap">
  <p class="eyebrow">Data Health Dashboard</p>
  <h1 class="voice">資料健康儀表板</h1>
  <p class="sub" id="updated-line">正在讀取健康報告...</p>
</div></header>

<div id="loading" class="wrap">正在讀取...</div>
<div id="error-box" class="wrap">找不到健康報告資料(docs/health.json),可能是全市場分析尚未執行過一次完整流程。</div>

<div id="content">
  <section><div class="wrap">
    <p class="section-title">總覽</p>
    <div id="status-banner-wrap"></div>
    <div class="summary-grid" id="summary-grid"></div>
  </div></section>

  <section><div class="wrap">
    <p class="section-title">抓取失敗清單</p>
    <div id="failures-body"></div>
  </div></section>

  <section><div class="wrap">
    <p class="section-title">資料品質異常(疑似減資/資料源錯誤未還原)</p>
    <div id="quality-body"></div>
  </div></section>
</div>

<footer>此頁面資料來自每日全市場分析(M10)的自我回報,不影響 docs/stocks 與 docs/index 的正常運作。</footer>

<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function buildSummaryGrid(summary) {
  const items = [
    { label: '全市場範圍', val: summary.universe_size, cls: '' },
    { label: '成功', val: summary.succeeded, cls: 'ok' },
    { label: '失敗', val: summary.failed, cls: summary.failed > 0 ? 'warn' : 'ok' },
    { label: '成功率', val: (summary.success_rate * 100).toFixed(1) + '%', cls: summary.success_rate >= 0.8 ? 'ok' : 'bad' },
    { label: '資料品質異常', val: summary.data_quality_flag_count, cls: summary.data_quality_flag_count > 0 ? 'warn' : 'ok' },
  ];
  return items.map(it => `
    <div class="metric">
      <span class="metric-label">${it.label}</span>
      <span class="metric-val ${it.cls}">${it.val}</span>
    </div>`).join('');
}

function buildStatusBanner(summary) {
  if (summary.failed === 0 && summary.data_quality_flag_count === 0) {
    return `<div class="status-banner ok"><span class="mark voice">✓</span><span>本次執行全部${summary.succeeded}檔皆成功且無資料品質異常,系統狀態良好。</span></div>`;
  }
  return `<div class="status-banner warn"><span class="mark voice">!</span><span>本次執行有 ${summary.failed} 檔抓取失敗、${summary.data_quality_flag_count} 檔資料品質異常,詳見下方清單。這是全市場654檔規模下的正常現象,不代表系統故障——只有整體成功率低於門檻時pipeline才會中止部署。</span></div>`;
}

function buildFailuresTable(failures) {
  if (!failures || !failures.length) {
    return `<p class="empty-note"><span class="mark">✓</span>本次執行沒有任何抓取失敗。</p>`;
  }
  const rows = failures.map(f => `
    <tr>
      <td class="ticker-cell">${esc(f.ticker)}</td>
      <td class="reason-cell">${esc(f.reason)}</td>
      <td class="stage-cell">${esc(f.stage || '--')}</td>
    </tr>`).join('');
  return `
    <table>
      <thead><tr><th>代號</th><th>原因</th><th>階段</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function buildQualityTable(flags) {
  if (!flags || !flags.length) {
    return `<p class="empty-note"><span class="mark">✓</span>本次執行沒有偵測到任何資料品質異常。</p>`;
  }
  const rows = flags.map(f => `
    <tr>
      <td class="ticker-cell"><a href="./stock.html?code=${esc(f.ticker.replace('.TW',''))}">${esc(f.name)} ${esc(f.ticker)}</a></td>
      <td class="reason-cell">${(f.issues || []).map(esc).join('；')}</td>
    </tr>`).join('');
  return `
    <table>
      <thead><tr><th>股票</th><th>問題</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function render(data) {
  const summary = (data.summary) || {};
  document.getElementById('updated-line').textContent =
    '最後更新: ' + new Date(data.last_updated).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }) + '(台灣時間)';

  document.getElementById('status-banner-wrap').innerHTML = buildStatusBanner(summary);
  document.getElementById('summary-grid').innerHTML = buildSummaryGrid(summary);
  document.getElementById('failures-body').innerHTML = buildFailuresTable(data.fetch_failures);
  document.getElementById('quality-body').innerHTML = buildQualityTable(data.data_quality_flags);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

async function load() {
  try {
    const res = await fetch('./health.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    render(await res.json());
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-box').style.display = 'block';
  }
}

load();
</script>

</body>
</html>
